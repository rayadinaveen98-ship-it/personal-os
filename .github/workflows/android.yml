name: Android verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'build/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and installable debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PersonalOS-verification-reports
          path: app/build/reports/
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        with:
          name: PersonalOS-v0.1.0-foundation-alpha-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  device-tests:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 33, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install device and build packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'emulator' 'system-images;android-${{ matrix.api }};google_apis;x86_64'
      - name: Boot Android device
        timeout-minutes: 8
        run: |
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/personal-os-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name personal-os-qa --path "$ANDROID_AVD_HOME/personal-os-qa.avd" --device pixel_2 --package 'system-images;android-${{ matrix.api }};google_apis;x86_64' --force
          avdmanager list avd
          test -f "$ANDROID_AVD_HOME/personal-os-qa.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd personal-os-qa -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          emulator_pid=$!
          trap 'cat emulator.log; adb devices -l' EXIT
          for attempt in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Emulator exited before connecting"
              exit 1
            fi
            if adb devices | grep -q 'emulator-.*device'; then break; fi
            sleep 2
          done
          timeout 30 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 2; done'
          adb shell input keyevent 82
      - name: Test Room, backup, domain persistence and app interactions
        run: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Print device test failures
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for path in Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml'):
              root=E.parse(path).getroot()
              print(path,root.attrib)
              for case in root.iter('testcase'):
                  failure=case.find('failure')
                  if failure is not None:
                      print(case.attrib)
                      print(failure.text)
          PY
      - name: Collect app failure diagnostics
        if: always()
        run: |
          timeout 30 adb logcat -d -v threadtime -s PersonalOS-QA:E AndroidRuntime:E > qa-logcat.txt || true
          cat qa-logcat.txt
      - name: Collect runtime screenshots
        if: always()
        run: timeout 30 adb pull /sdcard/Download/personal-os-qa qa-screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PersonalOS-device-API-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
            qa-logcat.txt
            qa-screenshots/
