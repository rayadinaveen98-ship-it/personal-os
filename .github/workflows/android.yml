name: Android verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'build/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and installable debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PersonalOS-verification-reports
          path: app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalOS-v0.1.0-foundation-alpha-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
