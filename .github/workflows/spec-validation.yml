name: Validate Personal OS Specs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-specs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required specification files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "docs/INDEX.md"
            "docs/decisions/DECISION_LOG.md"
            "docs/00-foundation/PRODUCT_FOUNDATION_V1.md"
            "docs/00-foundation/PRODUCT_PRINCIPLES.md"
            "docs/00-foundation/V1_SCOPE_MATRIX.md"
            "docs/00-foundation/FOUNDER_DIRECTION_PREMIUM_EXPERIENCE_2026_09_12.md"
            "docs/01-information-architecture/ROUTE_HIERARCHY_FROZEN_V1.md"
            "docs/02-ux-flows/SCREEN_FLOW_MATRIX_V0_1.md"
            "docs/03-screen-specs/TODAY_HOME_V0_1.md"
            "docs/03-screen-specs/SCREEN_SPEC_RESOLUTIONS_V1_FROZEN.md"
            "docs/04-design-system/VISUAL_REFERENCE_MANIFEST.md"
            "docs/04-design-system/DESIGN_TOKENS_V1_FROZEN.md"
            "docs/04-design-system/ASSET_LICENSE_MANIFEST_V1.md"
            "docs/05-behavior/TASKS_REMINDERS_V0_1.md"
            "docs/06-intelligence/PERSONAL_INTELLIGENCE_V0_1.md"
            "docs/07-data/DATA_SCHEMA_V1_FROZEN.md"
            "docs/07-data/PRIVACY_BACKUP_SECURITY_V0_1.md"
            "docs/08-android/ANDROID_ARCHITECTURE_V0_1.md"
            "docs/08-android/ANDROID_BUILD_BASELINE_FROZEN_2026_09_12.md"
            "docs/09-qa/V1_ACCEPTANCE_TEST_PLAN_V0_1.md"
            "docs/09-qa/RC_DEVICE_MATRIX_V1.md"
            "docs/10-execution/PRE_BUILD_SECRETS_AUDIT_2026_09_12.md"
            "docs/10-execution/FINAL_CONSISTENCY_AUDIT_V1.md"
            "docs/10-execution/BUILD_HANDOFF_READINESS.md"
            "docs/10-execution/ASTRA_EXECUTION_BRIEF_V1.md"
          )

          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required specification: $file"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          echo "Frozen V1 specification package is present."

      - name: Guard migration safety
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.md' "fallbackToDestructiveMigration() is acceptable" docs; then
            echo "Specification contradicts the no-destructive-migration rule."
            exit 1
          fi
          echo "Migration safety guard passed."

      - name: Guard frozen product truths
        shell: bash
        run: |
          set -euo pipefail
          grep -q "No fabricated personal data" docs/decisions/DECISION_LOG.md
          grep -q "Today / Plan / central Capture / Journey / Me" docs/decisions/DECISION_LOG.md
          grep -q "V1 VISUAL TARGETS FROZEN" docs/04-design-system/VISUAL_REFERENCE_MANIFEST.md
          grep -q "FROZEN for initial implementation" docs/07-data/DATA_SCHEMA_V1_FROZEN.md
          grep -q "FROZEN for Astra implementation start" docs/08-android/ANDROID_BUILD_BASELINE_FROZEN_2026_09_12.md
          grep -q "READY FOR ASTRA EXECUTION" docs/10-execution/BUILD_HANDOFF_READINESS.md
          grep -q "AUTHORIZED: Execute Personal OS end-to-end" docs/10-execution/ASTRA_EXECUTION_BRIEF_V1.md
          echo "Frozen product truth guards passed."
